# Tests, lint and the security checks of DESIGN.md §17: ruff (with its security rules), bandit, pip-audit,
# pnpm audit, a container image scan (Trivy) and an OWASP ZAP baseline scan of the running app; then an
# accessibility audit (axe-core) of every page.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build the test image
        run: docker build --target test -t resume-tailor:test .
      - name: Tests
        run: docker run --rm resume-tailor:test
      - name: Lint (ruff, with its security rules)
        run: docker run --rm resume-tailor:test ruff check --no-cache app tests
      - name: Bandit
        working-directory: backend
        run: uvx bandit -c pyproject.toml -r app -q
      - name: Known vulnerabilities in Python dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --format requirements-txt --no-hashes --extra postgres --extra dev --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Known vulnerabilities in npm dependencies
        run: pnpm audit

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the app image
        run: docker build -t resume-tailor:latest .
      - name: Scan the image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln,secret resume-tailor:latest
      - name: Start the app (offline model, nothing real)
        run: |
          printf 'APP_SECRET_KEY=%s\nAI_PROVIDER=fake\nAPP_BASE_URL=http://localhost:8080\n' "$(openssl rand -hex 32)" > "$RUNNER_TEMP/ci.env"
          RT_ENV_FILE="$RUNNER_TEMP/ci.env" docker compose up -d --wait
      - name: OWASP ZAP baseline scan
        run: |
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv -I -j
      - name: Accessibility audit (axe-core, WCAG 2.1 AA, every page in light and dark, desktop and phone)
        run: |
          corepack enable
          (cd frontend && pnpm install --frozen-lockfile)
          docker build --target test -t resume-tailor:test .
          token=$(docker compose logs app | grep -o 'Setup token: [^ ]*' | tail -1 | cut -d' ' -f3)
          docker run --rm --network host -v "$(realpath frontend/node_modules/axe-core/axe.min.js):/axe.min.js:ro" \
            resume-tailor:test python -m tests.a11y http://localhost:8080 --setup-token "$token" --axe /axe.min.js
      - name: Logs
        if: failure()
        run: docker compose logs app

  platforms:
    # Images for linux/amd64 and linux/arm64 (DESIGN.md §5, Portability). Slow under emulation: main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --platform linux/amd64,linux/arm64 .
