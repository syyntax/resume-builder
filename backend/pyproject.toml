[project]
name = "resume-tailor"
version = "0.1.0"
description = "Self-hosted résumé and cover letter tailoring with Claude"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "anthropic>=1.0",
    "cryptography>=44",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "mammoth>=1.10",
    "rapidfuzz>=3.13",
    "nh3>=0.3",
    "playwright>=1.50",
    "jinja2>=3.1",
    "segno>=1.6",  # QR codes for setting up two-step verification
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",
    "ruff>=0.8",
    "jsonschema>=4.23",
    "fpdf2>=2.8",
    "pdfminer-six>=20250506",
    "pypdfium2>=4.30",  # template thumbnails (python -m app.render.thumbnails)
]

[project.scripts]
resume-tailor = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI dependencies are declared as call defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/db/migrations/**" = ["E501"]

[tool.bandit]
# Asserts only narrow types for the type checker (never security checks), and ruff's S101 reviews them already.
skips = ["B101"]
